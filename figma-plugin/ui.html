<!DOCTYPE html>
<html>
  <head>
    <style>
      body { font: 13px/1.4 Inter, system-ui, sans-serif; padding: 14px; color: #171618; margin: 0; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; }
      button { margin-top: 10px; padding: 8px 12px; border: 0; border-radius: 8px; background: #171618; color: #fff; cursor: pointer; }
      #status { color: #727578; margin-top: 10px; min-height: 1.2em; }
      .hint { color: #727578; margin: 0 0 10px; }
    </style>
  </head>
  <body>
    <p class="hint">Paste the layer-model URL from Thumbnail Studio (CDN URL ending in <code>.json</code>).</p>
    <input id="url" placeholder="https://storage.cohesivity.ai/.../figma-layer-….json" />
    <button id="import">Import layers</button>
    <p id="status"></p>
    <script>
      const urlInput = document.getElementById("url");
      const status = document.getElementById("status");
      document.getElementById("import").onclick = () => {
        const url = urlInput.value.trim();
        if (!url) {
          status.textContent = "Paste a URL first.";
          return;
        }
        status.textContent = "Importing…";
        parent.postMessage({ pluginMessage: { type: "import-url", url } }, "*");
      };
      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "done") status.textContent = "Imported.";
        if (msg.type === "error") status.textContent = msg.message;
      };
    </script>
  </body>
</html>
